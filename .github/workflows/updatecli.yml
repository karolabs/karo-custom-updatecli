# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

---

name: Updatecli

on:
  # manual trigger
  workflow_dispatch:
  # once per day
  schedule:
    - cron: "0 0 * * *"

permissions:
  # create git commits
  contents: write
  # open pull requests
  pull-requests: write

jobs:
  updatecli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        images:
          - whoami
          - cetusguard
          - pocketid
          - traefik
        include:
          - images: traefik
            dhi: true

    steps:
      - name: Run Checkout # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli # https://github.com/updatecli/updatecli-action
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0

      - name: Run Docker Login # https://github.com/docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ matrix.dhi == true }}

      - run: echo '${{ github.event.repository.name }}' # TEMP

      - name: Run Updatecli
        run: "updatecli apply --config updatecli/updatecli.d/images.yml --values updatecli/values.d/${{ matrix.images }}.yml"
        env:
          UPDATECLI_GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          UPDATECLI_GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}"
