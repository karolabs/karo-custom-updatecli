# GitHub Actions workflow, for running configurable automated processes.
# See https://docs.github.com/actions for more information.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

---

name: Updatecli

on:
  # manual trigger
  workflow_dispatch:
  # once per day
  schedule:
    - cron: "0 0 * * *"

permissions:
  # create git commits
  contents: write
  # open pull requests
  pull-requests: write

jobs:
  updatecli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

      # repo config
      matrix:
        image:
          - whoami
          - cetusguard
          - pocketid
          - traefik
        include:
          - image: traefik
            registry: dhi.io

    steps:
      - name: Run Checkout # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Install Updatecli # https://github.com/updatecli/updatecli-action
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0

      - name: Run Docker Login # https://github.com/docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ matrix.registry }}

      - name: Run Updatecli update-images.yml
        run: |
          updatecli pipeline apply \
            --config updatecli/updatecli.d/update-images.yml \
            --values updatecli/values.d/images/${{ matrix.image }}.yml
        env:
          UPDATECLI_GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          UPDATECLI_GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_GITHUB_ACTOR: ${{ github.actor }}
          UPDATECLI_GITHUB_BRANCH: dev
          UPDATECLI_GITHUB_PR_LABEL: Kind/Update
