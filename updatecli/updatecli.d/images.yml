# updatecli manifest, for configuring declarative update policies.
# See https://updatecli.io for more information.
# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json

name: 'Update {{ .image.repository }}'

sources:
  docker-image:
    name: Gather newest image tag
    kind: dockerimage
    spec:
      image: '{{ .image.repository }}'
      versionfilter:
        kind: regex/semver
        regex: '{{ .image.version.regex }}'
        pattern: '{{ .image.version.pattern }}'
        #{{- if .image.version.strict }}
        strict: true
        #{{- end }}

  docker-digest:
    name: Resolve image digest
    kind: dockerdigest
    spec:
      image: '{{ .image.repository }}'
      tag: '{{ source "docker-image" }}'

scms:
  github-repo:
    kind: github
    spec:
      owner: '{{ requiredEnv "UPDATECLI_GITHUB_REPOSITORY_OWNER" }}'
      repository: karo-custom-updatecli
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: dev
      commitmessage:
        type: ""
        hidecredit: true
        body: |
          This commit was generated by Updatecli.
      commitusingapi: true
      workingbranchseparator: '-'

actions:
  pull-request:
    kind: github/pullrequest
    scmid: github-repo
    spec:
      labels:
        - Kind/Update

targets:
  images-file:
    name: 'bump {{ .image.repository }} to {{ source "docker-image" }}' # commit title
    kind: yaml
    sourceid: docker-digest
    scmid: github-repo
    transformers:
      - addprefix: '{{ .image.repository }}:'
    spec:
      file: compose/images.yml
      key: '{{ .image.key }}'
