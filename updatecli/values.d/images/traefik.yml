image:
  name: traefik
  repository: dhi.io/traefik
  tag_regex: '^([0-9]+\.[0-9]+\.[0-9]+)-alpine$' # 1.0.0-alpine
  semver:
    pattern: '*'
    strict: true
  file_key: $.karolabs_traefik_image
  pr_notes: |
    https://custom.karolabs.dev/karolabs_core/traefik/
