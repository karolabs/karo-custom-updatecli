# Values file for `updatecli`, a declarative update policy engine.
# See https://updatecli.io for more information.

image:
  name: whoami
  repository: docker.io/traefik/whoami
  version:
    regex: '^v([0-9]+\.[0-9]+\.[0-9]+)$' # v1.0.0
    pattern: '*'
    strict: true
  key: $.karolabs_whoami_image
  notes: |
    https://custom.karolabs.dev/karolabs_ops/whoami/
