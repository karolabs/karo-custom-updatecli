# Values file for `updatecli`, a declarative update policy engine.
# See https://updatecli.io for more information.

image:
  name: pocketid
  repository: docker.io/pocketid/pocket-id
  version:
    regex: '^v([0-9]+\.[0-9]+\.[0-9]+)-distroless$' # v1.0.0-distroless
    pattern: '*'
    strict: true
  key: $.karolabs_pocketid_image
  notes: |
    https://custom.karolabs.dev/karolabs_core/pocket-id/
